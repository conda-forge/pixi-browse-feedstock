context:
  version: "0.0.20"
  python_min: '3.13'

package:
  name: pixi-browse
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pixi-browse/pixi_browse-${{ version }}.tar.gz
  sha256: 31d7e117af647c1dd8017dba81d6e86c442cc859b914d2cdb79852538fb1cf67

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - pixi-browse = pixi_browse.__main__:cli
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - textual >=8.2.8,<9
    - py-rattler >=0.27.0,<0.28
    - typer >=0.27.2,<0.28
    - pyyaml >=6.0.3,<7
  run_constraints:
    - textual-diff-view >=0.1.5,<0.2
    - python-magic >=0.4.27,<0.5
  extras:
    diff:
      - textual-diff-view >=0.1.5,<0.2
    filetype:
      - python-magic >=0.4.27,<0.5
tests:
  - python:
      imports:
        - pixi_browse
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
  - script:
      - pixi-browse --help
      - pixi-browse --version

about:
  homepage: https://github.com/pavelzw/pixi-browse
  repository: https://github.com/pavelzw/pixi-browse
  documentation: https://github.com/pavelzw/pixi-browse
  summary: A TUI to browse conda packages
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
